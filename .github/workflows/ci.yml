name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm exec -w @birthday-planner/core -- prisma generate
      - run: npm run typecheck -w @birthday-planner/core
      - run: npm test -w @birthday-planner/core

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @birthday-planner/ui
      - run: npm run lint -w @birthday-planner/ui
      - run: npm run test:coverage -w @birthday-planner/ui

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build -w @birthday-planner/web
